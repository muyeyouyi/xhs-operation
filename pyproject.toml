[project]
name = "media-ops"
version = "0.1.0"
description = "AI 教育自媒体内容工作台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.5,<3",
    "playwright>=1.49,<2",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/media_ops"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
